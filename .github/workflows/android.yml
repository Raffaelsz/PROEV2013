name: Gerar APK PES 2013 Android v1.5

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar ZIP do projeto
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 5 -type f \
            -iname 'PES2013_Android_v1.5_MANUAL_FIXED.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "::error::ZIP PES2013_Android_v1.5_MANUAL_FIXED.zip não encontrado."
            echo "Envie o arquivo ZIP para a raiz do repositório."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          mkdir -p /tmp/pes-project
          unzip -q "$ZIP" -d /tmp/pes-project

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find /tmp/pes-project \
            -type f -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts não encontrado dentro do ZIP."
            find /tmp/pes-project -maxdepth 4 -type f | head -100
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          cp -a "$ROOT"/. "$GITHUB_WORKSPACE"/

          for FILE in \
            settings.gradle.kts \
            build.gradle.kts \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Arquivo obrigatório ausente: $FILE"
              exit 1
            fi
          done

          echo "Estrutura do projeto validada."

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::A compilação não gerou nenhum APK."
            exit 1
          fi

          echo "APK gerado:"
          ls -lh "$APK"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: PES2013-Android-v1.5-MANUAL-FIXED
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
